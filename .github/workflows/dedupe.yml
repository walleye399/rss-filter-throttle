name: dedupe

# RSS由来メールの重複(同じ Message-ID)を整理する単発ワークフロー。
# 先に apply をオフで実行して件数を確認し、問題なければ apply をオンで実行します。
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "実際に削除する（オフなら件数の確認だけ）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: sync          # sync と同時に動かさない
  cancel-in-progress: false

jobs:
  dedupe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Checkout data repo (private)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.DATA_REPO }}
          token: ${{ secrets.DATA_TOKEN }}
          path: data
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dedupe
        env:
          DATA_DIR: ${{ github.workspace }}/data
          APPLY: ${{ github.event.inputs.apply == 'true' && '1' || '0' }}
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASS: ${{ secrets.IMAP_PASS }}
        run: python tools/dedupe_mailbox.py
